# NOTE: DAppNode's setup-wizard schema has no boolean/checkbox/toggle field type
# (only `enum` -> select menu, `pattern` -> text, `secret` -> masked text). A
# two-option `enum` ["true","false"] rendered as a dropdown is the canonical
# DAppNode idiom for an on/off setting. See repo issue #1.
# Each field sets `default:` so the wizard pre-selects a value instead of showing
# a blank "Select value" (the `default` property is supported by the SDK even
# though the hosted docs page omits it; cf. the official nethermind package).
version: "2"
fields:
  - id: miningEnabled
    target:
      type: environment
      name: MINING_ENABLED
    title: Enable mining
    description: >-
      Run PoW mining so the node self-funds (needed to win proposal slots on
      testnet). Leave on unless you only want a syncing/observing node.
    required: false
    enum:
      - "true"
      - "false"
    default: "true"
  - id: miningMaxThreads
    target:
      type: environment
      name: MINING_MAX_THREADS
    title: Mining CPU threads
    description: >-
      Max CPU threads used for mining. Kept low on purpose so the node never
      pegs the host. Default 1 — raise only on a dedicated box.
    required: false
    pattern: "^[1-9][0-9]*$"
    patternErrorMessage: Must be a positive integer (1 or more).
    default: "1"
  - id: logLevel
    target:
      type: environment
      name: LOG_LEVEL
    title: Log level
    description: Node log verbosity (RUST_LOG). Use debug only when troubleshooting.
    required: false
    enum:
      - error
      - warn
      - info
      - debug
      - trace
    default: "info"
