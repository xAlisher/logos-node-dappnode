# NOTE: DAppNode's setup-wizard schema has no boolean/checkbox/toggle field type
# (only `enum` -> select menu, `pattern` -> text, `secret` -> masked text). A
# two-option `enum` ["true","false"] rendered as a dropdown is the canonical
# DAppNode idiom for an on/off setting. See repo issue #1.
#
# `target.service` MUST match the compose service that owns the env var (`node`).
# DAppNode seeds each field's displayed value from environment[target.service || <dnp-name>]
# (admin-ui formDataParser.userSettingsToFormData); our service is `node`, not the
# package name, so WITHOUT `service: node` the lookup misses and the field renders
# blank ("Select value") even though the value is set. With it, the wizard pre-fills
# from the compose `environment` defaults on install and shows current values on the
# Config page. (v2 SetupWizardField has no `default` property; defaults live in compose.)
version: "2"
fields:
  - id: miningEnabled
    target:
      type: environment
      name: MINING_ENABLED
      service: node
    title: Enable mining
    description: >-
      Run PoW mining so the node self-funds (needed to win proposal slots on
      testnet). Leave on unless you only want a syncing/observing node.
    required: false
    enum:
      - "true"
      - "false"
  - id: miningMaxThreads
    target:
      type: environment
      name: MINING_MAX_THREADS
      service: node
    title: Mining CPU threads
    description: >-
      Max CPU threads used for mining. Kept low on purpose so the node never
      pegs the host. Default 1, raise only on a dedicated box.
    required: false
    pattern: "^[1-9][0-9]*$"
    patternErrorMessage: Must be a positive integer (1 or more).
  - id: logLevel
    target:
      type: environment
      name: LOG_LEVEL
      service: node
    title: Log level
    description: Node log verbosity (RUST_LOG). Use debug only when troubleshooting.
    required: false
    enum:
      - error
      - warn
      - info
      - debug
      - trace
