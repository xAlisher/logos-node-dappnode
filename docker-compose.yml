version: "3.5"
services:
  node:
    build:
      context: .
      dockerfile: Dockerfile
    image: "node.logos-node.public.dappnode.eth:0.1.2"
    restart: unless-stopped
    environment:
      - MINING_ENABLED=true
      - MINING_MAX_THREADS=1
      - LOG_LEVEL=info
    volumes:
      - "data:/data"
    ports:
      - "3000:3000/udp"
      - "3400:3400/udp"
    deploy:
      resources:
        limits:
          memory: 6g
          cpus: "2"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/cryptarchia/info || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 600s
volumes:
  data: {}
