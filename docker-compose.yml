# NOTE: keep this top-level `version` — the DAppNode SDK's validateComposeVersion
# requires it (docker-compose itself calls it obsolete, but the SDK does not).
version: "3.5"
services:
  node:
    build:
      context: .
      dockerfile: Dockerfile
      # NODE_VERSION is the upstream release tag; the bump-upstream CI edits it
      # in place when logos-blockchain/logos-blockchain cuts a new release.
      args:
        NODE_VERSION: 0.3.0
    image: "node.logos-blockchain-node.public.dappnode.eth:0.1.18"
    restart: unless-stopped
    environment:
      - MINING_ENABLED=true
      - MINING_MAX_THREADS=1
      - LOG_LEVEL=info
    volumes:
      - "data:/data"
    ports:
      - "3000:3000/udp"
      - "3400:3400/udp"
    deploy:
      resources:
        limits:
          memory: 6g
          cpus: "2"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/cryptarchia/info || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 600s
  monitoring:
    build:
      context: ./monitoring
      dockerfile: Dockerfile
    image: "monitoring.logos-blockchain-node.public.dappnode.eth:0.1.18"
    restart: unless-stopped
    environment:
      # Reach the node over the package's internal docker network by service name.
      - NODE_API=http://node:8080
      - LISTEN_PORT=9112
    depends_on:
      - node
  webui:
    build:
      context: ./webui
      dockerfile: Dockerfile
    image: "webui.logos-blockchain-node.public.dappnode.eth:0.1.18"
    restart: unless-stopped
    environment:
      # Reverse-proxy /api to the node over the package's internal network.
      - NODE_UPSTREAM=node:8080
    depends_on:
      - node
volumes:
  data: {}
